name: MUSE RADAR refresh + Pages deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 */2 * * *'
      timezone: 'Asia/Seoul'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: muse-radar-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline integrity tests
        run: python -m unittest discover -s tests -v
      - name: Update trend data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ENABLE_INSTAGRAM: "1"
          ENABLE_TIKTOK: "0"
          IG_RESULTS_PER_TAG: "4"
        run: python scripts/update.py
      - name: Commit refreshed public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trends.json data/trends.js data/post_index.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "data: update Korean beauty trend feed"
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "Remote updated while refreshing; rebasing and retrying ($attempt/3)"
              git fetch origin main
              git rebase origin/main
              if [ "$attempt" = "3" ]; then exit 1; fi
              sleep 2
            done
          fi

  deploy:
    needs: refresh
    if: needs.refresh.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out latest website data
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp feed.xml _site/ || true
          cp -r assets data _site/
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
