name: MUSE RADAR daily refresh and Pages deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '10 9 * * *'
      timezone: 'Asia/Seoul'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: muse-radar-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update trend data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/update.py
      - name: Commit refreshed public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trends.json data/trends.js data/post_index.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "data: update Korean beauty trend feed"
            git push
          fi

  deploy:
    needs: refresh
    if: always() && needs.refresh.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp feed.xml _site/ || true
          cp -r assets data _site/
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
